<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden;user-select:none;font:800 12px -apple-system,"Segoe UI",Arial,sans-serif}
.p{position:absolute;inset:6px;display:flex;align-items:center;gap:8px;padding:0 8px 0 6px;border-radius:999px;
  background:linear-gradient(180deg,rgba(30,42,32,.96),rgba(14,20,15,.96));border:1px solid #3d5440;
  box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 8px 22px rgba(0,0,0,.55)}
.grip{width:12px;align-self:stretch;-webkit-app-region:drag;cursor:move;display:flex;flex-direction:column;justify-content:center;gap:3px;padding-left:4px}
.grip i{display:block;width:4px;height:4px;border-radius:50%;background:#5f7a3a}
.aim{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:grab;touch-action:none;
  background:radial-gradient(circle,#3a1512,#1a0907);border:1px solid #8a2a22;box-shadow:0 0 14px rgba(255,59,48,.45)}
.aim:active{cursor:grabbing;transform:scale(.95)}
.aim svg{width:32px;height:32px;filter:drop-shadow(0 0 4px rgba(255,59,48,.9))}
.app{white-space:nowrap;display:flex;align-items:center;gap:7px;height:40px;padding:0 12px 0 8px;border-radius:999px;border:1px solid #3d5440;color:#e6ecdf;cursor:pointer;
  background:linear-gradient(180deg,#25332a,#141c16)}
.app i{width:22px;height:14px;border:2.5px solid #9dbb63;border-radius:50%;position:relative;box-sizing:border-box}
.app i::after{content:"";position:absolute;inset:2px 5px;border-radius:50%;background:#ff4b3e}
.app:active{transform:translateY(1px)}
</style></head><body>
<div class="p">
  <div class="grip" title="Перемістити"><i></i><i></i><i></i></div>
  <div class="aim" id="aim" title="Потягніть приціл на відео — або клацніть"><svg viewBox="0 0 64 64" fill="none" stroke="#ff3b30" stroke-width="4" stroke-linecap="round"><circle cx="32" cy="32" r="20"/><circle cx="32" cy="32" r="3.5" fill="#ff3b30"/><path d="M32 4v14M32 46v14M4 32h14M46 32h14"/></svg></div>
  <div class="app" id="app"><i></i><span id="appT">ОКО-ШІ</span></div>
</div>
<script>
const D=window.okoDesktop, q=new URLSearchParams(location.search);
const tx=l=>{document.getElementById('appT').textContent=l==='en'?'OKO-AI':'ОКО-ШІ';document.getElementById('aim').title=l==='en'?'Drag the crosshair onto the video — or click it':'Потягніть приціл на відео — або клацніть';};
tx(q.get('lang')); D.onLang(tx);
const aim=document.getElementById('aim'); let down=false;
aim.addEventListener('pointerdown',e=>{down=true;aim.setPointerCapture(e.pointerId);D.pillDragStart();});
aim.addEventListener('pointerup',e=>{if(!down)return;down=false;D.pillDragEnd();});
aim.addEventListener('lostpointercapture',()=>{if(down){down=false;D.pillDragEnd();}});
document.getElementById('app').onclick=()=>D.openMain();
</script></body></html>

name: Windows і Mac
on:
  push:
    branches: [main]
    paths: ['app/**', 'desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: desktop
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            cmd: dist:mac
            file: OKO-AI-Mac.dmg
          - os: windows-latest
            cmd: dist:win
            file: OKO-AI-Windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Зібрати
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install
          npm run ${{ matrix.cmd }}
      - name: Перевірити файл
        shell: bash
        run: ls -la desktop/dist/ && test -f "desktop/dist/${{ matrix.file }}"
      - name: Опублікувати
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: ОКО-ШІ — Windows і Mac (остання збірка)
          body: |
            ## Windows
            1. Запустіть `OKO-AI-Windows.exe`.
            2. Якщо з'явиться «Windows захистив ваш ПК» (Windows protected your PC): **«Додаткові відомості»** (More info) → **«Усе одно запустити»** (Run anyway). Програма встановиться сама, ярлик — на робочому столі.
            3. Камера: при першому натисканні — «Завжди дозволяти». Якщо камеру вимкнено в Windows, ОКО-ШІ сама відкриє **Параметри → Конфіденційність і захист → Камера** (Settings → Privacy & security → Camera): увімкніть «Доступ до камери», «Дозволити програмам доступ до камери», «Дозволити класичним програмам доступ до камери».

            ## Mac (Apple Silicon)
            1. Відкрийте `OKO-AI-Mac.dmg`, перетягніть **OKO-AI** у **«Програми»** (Applications).
            2. Перший запуск. **macOS 15+:** двічі клацніть OKO-AI → «Готово» → **Системні параметри → Конфіденційність і безпека** (System Settings → Privacy & Security) → внизу «OKO-AI заблоковано…» → **«Усе одно відкрити»** (Open Anyway) → пароль. **macOS 14 і старші:** правий клік → «Відкрити».
            3. Камера: «Завжди дозволяти» → у вікні macOS «Дозволити». Якщо заборонено — ОКО-ШІ сама відкриє **Конфіденційність і безпека → Камера**: увімкніть OKO-AI.
            4. Зони: при першій зоні ОКО-ШІ сама відкриє **Конфіденційність і безпека → Запис екрана** (у macOS 15 — «Запис екрана й системного аудіо»): увімкніть OKO-AI — програма перезапуститься сама.

            Розробник: Юрій Мельничук, 158 навчальний центр, позивний «Композитор».
          files: desktop/dist/${{ matrix.file }}
          make_latest: false
